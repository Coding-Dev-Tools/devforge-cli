[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "devforge-tools"
version = "0.4.0"
description = "Unified CLI for 10 developer tools: API contracts, SQL generation, infra diffs, config drift, API mocking, key management, env syncing, schema conversion, MCP servers, and dead code removal"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "DevForge"}]
keywords = ["devforge-tools", "devforge", "cli", "devops", "developer-tools", "api-contract", "openapi", "json-to-sql", "infrastructure", "terraform", "cloudformation", "config-drift", "devsecops", "mocking", "api-keys", "env", "schema", "mcp", "dead-code"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
]

# Optional groups — install with: pip install devforge-tools[all]
[project.optional-dependencies]
# These tools are not on public PyPI yet, so each extra points at its GitHub repo.
# Bare names (e.g. "deadcode", "envault", "json2sql") resolve to unrelated
# packages owned by other people. Switch to version pins once each tool is published.
guard = ["api-contract-guardian @ git+https://github.com/Coding-Dev-Tools/api-contract-guardian.git"]
sql = ["json2sql-cli @ git+https://github.com/Coding-Dev-Tools/json2sql.git"]
deploy = ["deploydiff @ git+https://github.com/Coding-Dev-Tools/deploydiff.git"]
drift = ["configdrift @ git+https://github.com/Coding-Dev-Tools/configdrift.git"]
ghost = ["apighost @ git+https://github.com/Coding-Dev-Tools/apighost.git"]
auth = ["apiauth @ git+https://github.com/Coding-Dev-Tools/apiauth.git"]
envault = ["rh-envault @ git+https://github.com/Coding-Dev-Tools/envault.git"]
schema = ["schemaforge-cli @ git+https://github.com/Coding-Dev-Tools/schemaforge.git"]
mcp = ["click-to-mcp @ git+https://github.com/Coding-Dev-Tools/click-to-mcp.git"]
deadcode = ["deadcode-cli @ git+https://github.com/Coding-Dev-Tools/deadcode.git"]
all = [
    "api-contract-guardian @ git+https://github.com/Coding-Dev-Tools/api-contract-guardian.git",
    "json2sql-cli @ git+https://github.com/Coding-Dev-Tools/json2sql.git",
    "deploydiff @ git+https://github.com/Coding-Dev-Tools/deploydiff.git",
    "configdrift @ git+https://github.com/Coding-Dev-Tools/configdrift.git",
    "apighost @ git+https://github.com/Coding-Dev-Tools/apighost.git",
    "apiauth @ git+https://github.com/Coding-Dev-Tools/apiauth.git",
    "rh-envault @ git+https://github.com/Coding-Dev-Tools/envault.git",
    "schemaforge-cli @ git+https://github.com/Coding-Dev-Tools/schemaforge.git",
    "click-to-mcp @ git+https://github.com/Coding-Dev-Tools/click-to-mcp.git",
    "deadcode-cli @ git+https://github.com/Coding-Dev-Tools/deadcode.git",
]
dev = ["pytest>=7.0.0", "pyright>=1.1.300"]

[project.urls]
Homepage = "https://github.com/Coding-Dev-Tools/devforge-tools"
Repository = "https://github.com/Coding-Dev-Tools/devforge-tools"
"Issue Tracker" = "https://github.com/Coding-Dev-Tools/devforge-tools/issues"

[project.scripts]
devforge = "devforge.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["*"]
